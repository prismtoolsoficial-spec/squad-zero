 case'aa12':c.fillRect(-11,-2,9,6);c.fillRect(-2,-3.5,26,7);c.fillRect(24,-2,12,4);c.beginPath();c.arc(14,6,5.5,0,TAU);c.fill();break;
 case'flamer':c.fillStyle='#8a2a1a';c.beginPath();c.ellipse(4,7,7,4,0,0,TAU);c.fill();c.fillStyle=B;c.fillRect(-4,-3,30,6);c.fillRect(26,-2,12,4);c.fillStyle='#ff9a3a';c.fillRect(37,-1,2,2);break;
 case'minigun':c.fillRect(-6,-5,16,10);for(let i=0;i<3;i++){const o=Math.sin((spin||0)+i*2.1)*3.2;c.fillStyle=i===1?'#2a2b2e':'#1b1c1e';c.fillRect(8,o-1.2,32,2.4);}c.fillRect(34,-4,4,8);c.fillRect(10,-4,3,8);break;

 case'sniper':c.fillRect(-13,-2,12,6.5);c.fillRect(-2,-3,23,6);c.fillRect(20,-1.3,26,2.6);c.fillStyle='#101012';c.fillRect(3,-8.5,16,4.2);c.fillRect(1,-7.8,3,3);c.fillRect(18,-7.8,3,3);c.fillStyle='#4a6a8a';c.fillRect(19.5,-7.6,1.2,2.4);break;

function drawHead(c,L,x,y,r,t,atk){const C=L._c;
 c.fillStyle=L.skin;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();
 c.beginPath();c.ellipse(x+r*0.35,y+r*0.35,r*0.72,r*0.64,0,0,TAU);c.fill();
 c.fillStyle=C.skinD;c.beginPath();c.ellipse(x-r*0.12,y+1.6,1.9,2.8,0,0,TAU);c.fill();
 c.fillStyle=L.skin;c.beginPath();c.moveTo(x+r*0.88,y-1.2);c.lineTo(x+r*1.2,y+2.9);c.lineTo(x+r*0.86,y+3.5);c.closePath();c.fill();
 if(L.pust){c.fillStyle='#b8d84a';[[-3,-4],[2,4],[-5,3]].forEach(q=>{c.beginPath();c.arc(x+q[0],y+q[1],1.6,0,TAU);c.fill();});}
 hair(c,L,x,y,r,t);
 const ex=x+r*0.55,ey=y-0.8;
 if(L.zombie){c.fillStyle=L.eyeGlow;c.beginPath();c.arc(ex,ey,1.9,0,TAU);c.fill();c.fillStyle='rgba(255,240,120,0.25)';c.beginPath();c.arc(ex,ey,4,0,TAU);c.fill();}
 else if(L.eye){c.fillStyle='#fff';c.beginPath();c.ellipse(ex,ey,2.4,1.9,0,0,TAU);c.fill();c.fillStyle=L.eye;c.beginPath();c.arc(ex+0.7,ey,1.35,0,TAU);c.fill();c.fillStyle='#111';c.beginPath();c.arc(ex+0.9,ey,0.6,0,TAU);c.fill();}
 else{c.fillStyle='#1a120c';c.beginPath();c.arc(ex+0.3,ey,1.35,0,TAU);c.fill();}
 c.strokeStyle=C.hairD;c.lineWidth=1.3;c.beginPath();c.moveTo(ex-2.4,ey-3.4);c.lineTo(ex+2.4,ey-3.8);c.stroke();
 if(L.zombie){c.fillStyle=L.spit?'#3a6a1a':'#2a0f0f';c.beginPath();c.ellipse(x+r*0.68,y+5.2,2.4,1.4+(atk||0)*2.2,0,0,TAU);c.fill();if(L.spit){c.fillStyle='#8ad83a';c.fillRect(x+r*0.6,y+6,1.2,3+Math.sin(t*4)*1.5);}}
 else{c.strokeStyle=C.skinD;c.lineWidth=1.1;c.beginPath();c.moveTo(x+r*0.5,y+5.4);c.lineTo(x+r*0.85,y+5.1);c.stroke();}
 if(L.glasses==='clear'){c.strokeStyle='#121212';c.lineWidth=1.25;rr(c,ex-3.1,ey-2.7,6.6,5,1.6);c.stroke();c.beginPath();c.moveTo(ex-3.1,ey-1);c.lineTo(x-r*0.25,y-0.6);c.stroke();c.fillStyle='rgba(200,230,255,0.18)';rr(c,ex-3.1,ey-2.7,6.6,5,1.6);c.fill();}
 else if(L.glasses==='sun'){c.fillStyle='#060607';rr(c,ex-3.4,ey-2.8,7.4,4.6,1.8);c.fill();c.strokeStyle='#060607';c.lineWidth=1.3;c.beginPath();c.moveTo(ex-3.4,ey-1.2);c.lineTo(x-r*0.25,y-0.8);c.stroke();c.fillStyle='rgba(255,255,255,0.4)';c.fillRect(ex-0.5,ey-2.2,2.2,1);}
 else if(L.visor){c.fillStyle='rgba(255,60,40,0.85)';rr(c,x-r*0.1,ey-2.4,r*1.2,3.6,1.5);c.fill();}}
function hair(c,L,x,y,r,t){const s=L.hs;if(s==='bald')return;
 if(s==='helmet'||s==='hardhat'||s==='armorhelm'){c.fillStyle=s==='hardhat'?'#f2c230':s==='armorhelm'?'#4a4f55':'#3d4a2e';c.beginPath();c.arc(x,y-1,r+2.4,Math.PI,TAU);c.lineTo(x+r+(s==='hardhat'?6:3.5),y+1);c.lineTo(x-r-3,y+1);c.closePath();c.fill();c.fillStyle='rgba(0,0,0,0.25)';c.fillRect(x-r-3,y-1,2*r+6.5,2);return;}
 c.fillStyle=L.hair;
 if(s==='patchy'){c.beginPath();c.arc(x-1,y,r+1,Math.PI*1.05,Math.PI*1.55);c.lineTo(x-1,y-2);c.closePath();c.fill();c.beginPath();c.arc(x+2,y-r+1,2.4,0,TAU);c.fill();return;}
 c.beginPath();c.moveTo(x-r*0.95,y+r*0.5);c.arc(x,y,r+1.4,Math.PI*0.86,Math.PI*1.9);
 c.quadraticCurveTo(x+r*0.55,y-r*0.38,x+r*0.05,y-r*0.32);c.lineTo(x-r*0.3,y+r*0.1);c.lineTo(x-r*0.32,y+r*0.62);c.closePath();c.fill();
 if(s==='slick'){c.strokeStyle='rgba(255,255,255,0.28)';c.lineWidth=1;c.beginPath();c.arc(x,y,r-0.4,Math.PI*1.18,Math.PI*1.62);c.stroke();}
 if(s==='curly'){for(let i=0;i<9;i++){const a=Math.PI*(0.86+i*0.125);c.beginPath();c.arc(x+Math.cos(a)*(r+1.2),y+Math.sin(a)*(r+1.2),3.4,0,TAU);c.fill();}}
 if(s==='wavy'){for(let i=0;i<5;i++){const a=Math.PI*(1.1+i*0.17);c.beginPath();c.arc(x+Math.cos(a)*(r+1.3),y+Math.sin(a)*(r+1.3),2.5,0,TAU);c.fill();}}}
function prep(L){if(!L._c)L._c={skinD:sh(L.skin,0.78),topD:sh(L.top,0.7),pantsD:sh(L.pants,0.68),top2D:L.top2?sh(L.top2,0.7):null,pants2D:L.pants2?sh(L.pants2,0.68):null,hairD:sh(L.hair,0.75)};return L._c;}
function drawHuman(c,L,s){
 const C=prep(L);const h=L.h,w=L.w,sc=s.sc||1,t=s.t||0;
 c.save();c.translate(s.x,s.y);
 if(s.dead)c.rotate(-s.f*Math.min(1,s.dead)*1.45);
 c.scale(s.f*sc,sc);
 if(s.alpha!==undefined)c.globalAlpha*=s.alpha;
 const th=15*h,sn=15*h,tor=25*h,hr=9.5*(0.85+0.15*h),tw=15*w,lw=8*Math.sqrt(w),au=12*Math.sqrt(h),af=12.5*Math.sqrt(h);
 let a1,k1,a2,k2,lean=0,bob=0;
 if(s.pose){const P=s.pose;a1=P.a1;k1=P.k1;a2=P.a2;k2=P.k2;lean=P.lean;bob=P.bob||0;}
 else if(s.slide){a1=1.4;k1=0.15;a2=0.75;k2=1.5;lean=-0.6;}
 else if(s.kick){a1=1.57;k1=0;a2=-0.3;k2=1.3;lean=-0.45;}
 else if(s.air){if(s.air<0){a1=0.8;k1=1.3;a2=-0.3;k2=1.0;}else{a1=0.35;k1=0.55;a2=-0.2;k2=0.4;}lean=0.06;}
 else if(s.crouch){a1=1.05;k1=1.9;a2=0.1;k2=1.75;lean=0.2;}
 else{const r=s.runAmt||0,ph=s.run||0;a1=Math.sin(ph)*0.78*r+0.04;k1=0.08+(0.15+1.15*Math.max(0,Math.cos(ph)))*r;a2=Math.sin(ph+Math.PI)*0.78*r-0.04;k2=0.08+(0.15+1.15*Math.max(0,Math.cos(ph+Math.PI)))*r;
  bob=-Math.abs(Math.sin(ph))*2.6*r;lean=0.13*r+(L.zombie?0.22:0);if(r<0.1)bob=Math.sin(t*2.2)*0.8;}
 const ly=(a,k)=>th*Math.cos(a)+sn*Math.cos(a-k);

 let al=0;if(s.aim!==undefined){al=s.f===1?s.aim:Math.PI-s.aim;al=Math.atan2(Math.sin(al),Math.cos(al));al=clamp(al,-1.45,1.45);}
 const sleeve=L.tt==='suit'?'#16171b':L.top,sleeveD=L.tt==='suit'?'#0c0c0e':C.topD,bare=L.tt==='tee'||L.tt==='vest'||L.tt==='none';
 const leg=(a,k,back)=>{const kx=hx+Math.sin(a)*th,ky=hy+Math.cos(a)*th,sa=a-k,fx=kx+Math.sin(sa)*sn,fy=ky+Math.cos(sa)*sn;
  c.lineCap='round';c.lineJoin='round';c.strokeStyle=back?C.pantsD:L.pants;c.lineWidth=lw;c.beginPath();c.moveTo(hx,hy);c.lineTo(kx,ky);c.lineTo(fx,fy);c.stroke();
  if(L.pp==='stripe'){c.strokeStyle=back?'#c8c8c8':'#fff';c.lineWidth=1.5;c.stroke();}
  else if(L.pp==='twotone'){c.strokeStyle=back?C.pants2D:L.pants2;c.lineWidth=lw*0.42;c.stroke();}
  else if(L.pp==='flowers'){c.fillStyle=back?'#e8e0e4':'#ffffff';for(let i=1;i<6;i++){const f=i/6;const px=f<0.5?hx+(kx-hx)*f*2:kx+(fx-kx)*(f-0.5)*2,py=f<0.5?hy+(ky-hy)*f*2:ky+(fy-ky)*(f-0.5)*2;const o=(i%2?1.6:-1.6);
   for(let q=0;q<5;q++){const aa=q/5*TAU;c.beginPath();c.arc(px+o+Math.cos(aa)*1.3,py+Math.sin(aa)*1.3,0.9,0,TAU);c.fill();}}}
  c.save();c.translate(fx,fy);c.rotate(-sa);c.fillStyle=back?sh(L.shoes,0.7):L.shoes;rr(c,-3.2,-1.5,11.5,5.2,2.2);c.fill();c.fillStyle='rgba(0,0,0,0.35)';c.fillRect(-3.2,2.6,11.5,1.4);c.restore();};
 const gpX=sx+2.5,gpY=sy+6;const G=s.gun&&s.gun!=='none'?GUNS[s.gun]:null;
 let ga=al;if(s.reload>0)ga=al+Math.sin(s.reload*Math.PI)*0.75;
 const rk=(s.recoil||0)*4.5,gx=gpX-Math.cos(ga)*rk,gy=gpY-Math.sin(ga)*rk;
 const tp=(px,py)=>[gx+Math.cos(ga)*px-Math.sin(ga)*py,gy+Math.sin(ga)*px+Math.cos(ga)*py];
 let backH,frontH;
 if(s.pose){frontH=[sx+s.pose.fh[0],sy+s.pose.fh[1]];backH=[sx+s.pose.bh[0],sy+s.pose.bh[1]];}
 else if(G){frontH=tp(G.grip[0],G.grip[1]);backH=s.reload>0?tp(G.mag[0]+Math.sin(s.reload*TAU)*3,G.mag[1]+4):tp(G.fore[0],G.fore[1]);}
 else if(L.zombie){const sw=Math.sin(t*3.3)*3,at=(s.atk||0);frontH=[sx+au+af*0.8+at*8,sy+1+sw-at*10];backH=[sx+au+af*0.7+at*6,sy-1-sw-at*6];}
 else{const sw=Math.sin(s.run||0)*(s.runAmt||0)*9;frontH=[sx+sw,sy+au+af-2];backH=[sx-sw,sy+au+af-2];}
 const arm=(x1,y1,x2,y2,back)=>{let dx=x2-x1,dy=y2-y1,d=hyp(dx,dy)||0.01;const md=au+af-0.4;if(d>md){x2=x1+dx/d*md;y2=y1+dy/d*md;d=md;}
  const base=Math.atan2(dy,dx),A=Math.acos(clamp((au*au+d*d-af*af)/(2*au*d),-1,1)),ea=base+A,ex=x1+Math.cos(ea)*au,ey=y1+Math.sin(ea)*au;
  c.lineCap='round';c.lineWidth=6.3*Math.sqrt(w);c.strokeStyle=L.tt==='none'?(back?C.skinD:L.skin):back?sleeveD:sleeve;c.beginPath();c.moveTo(x1,y1);c.lineTo(ex,ey);c.stroke();
  c.strokeStyle=bare?(back?C.skinD:L.skin):(back?sleeveD:sleeve);c.lineWidth=5.6*Math.sqrt(w);c.beginPath();c.moveTo(ex,ey);c.lineTo(x2,y2);c.stroke();
  if(L.tt==='track'){c.strokeStyle=back?'#c8c8c8':'#fff';c.lineWidth=1.3;c.beginPath();c.moveTo(x1,y1);c.lineTo(ex,ey);c.lineTo(x2,y2);c.stroke();}
  if(L.tt==='suit'){c.strokeStyle='#f2f2f2';c.lineWidth=2;const ux=(x2-ex),uy=(y2-ey),ul=hyp(ux,uy)||1;c.beginPath();c.moveTo(x2-ux/ul*3,y2-uy/ul*3);c.lineTo(x2-ux/ul*1.5,y2-uy/ul*1.5);c.stroke();}
  c.fillStyle=L.acc&&L.acc.gloves?L.acc.gloves:back?C.skinD:L.skin;c.beginPath();c.arc(x2,y2,3.3,0,TAU);c.fill();};
 if(L.acc)accBack(c,L,sx,sy,hx,hy,t);

 c.fillStyle=L.pants;rr(c,-tw/2,-6,tw,10,4);c.fill();
 c.fillStyle=L.tt==='none'?L.skin:L.top;rr(c,-tw/2-0.5,-tor-3,tw+1,tor+1,5);c.fill();
 if(L.tt==='split'){c.fillStyle=L.top2;rr(c,-tw/2-0.5,-tor*0.47,tw+1,tor*0.47-1,4);c.fill();c.fillStyle='rgba(255,255,255,0.75)';c.fillRect(-tw/2,-tor*0.5,tw,1.4);}
 if(w>1.15){c.fillStyle=L.tt==='none'?L.skin:(L.top2||L.top);c.beginPath();c.ellipse(tw*0.38,-tor*0.32,4.5*(w-0.85)*2.2,tor*0.3,0,0,TAU);c.fill();}
 if(L.tt==='hoodie'){c.fillStyle=C.topD;rr(c,0,-tor*0.43,tw/2+0.5,tor*0.27,2);c.fill();c.strokeStyle=sh(L.top,0.55);c.lineWidth=1;c.beginPath();c.moveTo(tw*0.36,-tor+1);c.lineTo(tw*0.36,-tor+9);c.moveTo(tw*0.22,-tor+1);c.lineTo(tw*0.2,-tor+8);c.stroke();}

 else if(L.tt==='suit'){c.fillStyle='#f4f4f4';c.beginPath();c.moveTo(tw*0.52,-tor-2.5);c.lineTo(tw*0.0,-tor-2.5);c.lineTo(tw*0.42,-tor*0.5);c.closePath();c.fill();c.fillStyle='#7a1a22';c.beginPath();c.moveTo(tw*0.36,-tor-1.5);c.lineTo(tw*0.46,-tor-1.5);c.lineTo(tw*0.47,-tor*0.55);c.lineTo(tw*0.38,-tor*0.48);c.closePath();c.fill();

function isOwned(id){if(id.startsWith('bst:'))return false;if(PROF.owned[id])return true;const k=id.split(':');if(k[0]==='skin'&&PROF.owned['skin:*:'+k[2]])return true;
 const def=itemDef(id);if(!def)return false;if(def.p===0&&!def.pass&&!def.lvl&&!def.req)return true;if(def.lvl&&PROF.lvl+PROF.prest*50>=def.lvl)return true;if(def.req&&PROF.st[def.req]>=def.rn)return true;return false;}
function itemDef(id){const k=id.split(':');if(k[0]==='wpn')return SHOPW[k[1]];if(k[0]==='bst')return BOOSTS[k[1]];if(k[0]==='skin')return SKINS.find(s=>s.id===k[2]);if(k[0]==='camo')return CAMOS.find(s=>s.id===k[1]);if(k[0]==='tr')return TRACERS.find(s=>s.id===k[1]);if(k[0]==='kfx')return KFX.find(s=>s.id===k[1]);return null;}
function itemName(id){const k=id.split(':'),d=itemDef(id);if(!d)return id;if(k[0]==='skin'){const c=CH.find(c=>c.id===k[1]);return d.n+(c?' · '+c.name:'');}return d.n+' ('+{camo:'camuflaje',tr:'balas',kfx:'efecto de baja',wpn:'arma',bst:'potenciador'}[k[0]]+')';}
function buy(id,price){if(isOwned(id)||PROF.chapas<price)return false;if(id.startsWith('bst:'))return buyBoost(id.split(':')[1],price);PROF.chapas-=price;PROF.owned[id]=1;PROF.st.buys++;sfx.reveal();toast('¡COMPRADO!',itemName(id),'#9fe870');equip(id);checkAch();saveProf();return true;}
function equip(id){const k=id.split(':');if(k[0]==='wpn'){PROF.eq.wpn=PROF.eq.wpn===k[1]?null:k[1];saveProf();return;}if(k[0]==='bst')return;if(k[0]==='skin'&&k[1]==='*'){PROF.eq.skin[CH[shopChar].id]=k[2];saveProf();return;}if(k[0]==='skin')PROF.eq.skin[k[1]]=k[2];else if(k[0]==='camo')PROF.eq.camo=k[1];else if(k[0]==='tr')PROF.eq.tr=k[1];else if(k[0]==='kfx')PROF.eq.kfx=k[1];saveProf();}
function isEquipped(id){const k=id.split(':');if(k[0]==='wpn')return PROF.eq.wpn===k[1];if(k[0]==='skin'&&k[1]==='*')return (PROF.eq.skin[CH[shopChar].id]||'base')===k[2];if(k[0]==='skin')return (PROF.eq.skin[k[1]]||'base')===k[2];if(k[0]==='camo')return PROF.eq.camo===k[1];if(k[0]==='tr')return PROF.eq.tr===k[1];if(k[0]==='kfx')return PROF.eq.kfx===k[1];return false;}
const skinCache={};
function skinned(base){const s=PROF.eq.skin[base.id];if(!s||s==='base')return base;const key=base.id+':'+s;if(skinCache[key])return skinCache[key];const d=SKINS.find(q=>q.id===s);if(!d)return base;
 const L=Object.assign({},base,{top:d.top,pants:d.pants,_c:null,glow:d.glow||null});if(d.tt&&(!(base.tt==='suit')||d.u))L.tt=d.tt;if(d.u){L.acc=d.acc;L.chest=null;L.top2=null;L.pack=null;if(d.shoes)L.shoes=d.shoes;if(d.acc.helm||d.acc.dome||d.acc.hood||d.acc.mask)L.glasses=null;if(d.acc.glassesG)L.glasses=null;}if(d.pp!==undefined)L.pp=d.pp;else L.pp=null;if(L.tt==='split'){L.tt='tee';}if(d.skin)L.skin=d.skin;if(d.id==='zombi'){L.eyeGlowP='#f4ff6a';}
 delete L._c;skinCache[key]=L;return L;}
function tracerCol(){const t=TRACERS.find(q=>q.id===PROF.eq.tr)||TRACERS[0];return t.col==='rainbow'?`hsl(${(T*240)%360},100%,65%)`:t.col;}
function camoFill(c,id){if(!id||id==='none')return'#1b1c1e';const g=c.createLinearGradient(-14,-4,46,4);const st=(cols,n)=>{for(let i=0;i<=n;i++){const a=i/n;g.addColorStop(Math.min(1,a),cols[i%cols.length]);if(i<n)g.addColorStop(Math.min(1,a+1/n-0.001),cols[i%cols.length]);}};
 const sh2=(T*0.6)%1;
 switch(id){case'bosque':st(['#3a4a2a','#24301a','#5a5a3a','#2e3a22'],7);break;case'urbano':st(['#6a6e74','#3a3d42','#8a8e94','#4a4d52'],7);break;case'tigre':st(['#e07a1a','#151515'],9);break;case'rojo':g.addColorStop(0,'#5a0808');g.addColorStop(1,'#b81c1c');break;
  case'oro':g.addColorStop(0,'#8a6a1a');g.addColorStop(Math.max(0,sh2-0.1),'#d4a72c');g.addColorStop(sh2,'#fff3b0');g.addColorStop(Math.min(1,sh2+0.1),'#d4a72c');g.addColorStop(1,'#8a6a1a');break;
  case'diamante':g.addColorStop(0,'#3ab8e0');g.addColorStop(Math.max(0,sh2-0.1),'#9ff0ff');g.addColorStop(sh2,'#ffffff');g.addColorStop(Math.min(1,sh2+0.1),'#9ff0ff');g.addColorStop(1,'#2a8ab8');break;
  case'calavera':st(['#2a1a3a','#e8e8e8','#2a1a3a','#2a1a3a'],8);break;
  case'arcoiris':for(let i=0;i<=6;i++)g.addColorStop(i/6,`hsl(${(i*60+T*120)%360},90%,55%)`);break;
  case'galaxia':g.addColorStop(0,'#1a0a3a');g.addColorStop(0.4,'#5a1a8a');g.addColorStop(0.6,'#1a3a8a');g.addColorStop(1,'#0a0a2a');break;
  case'leyenda':g.addColorStop(0,'#5a0a0a');g.addColorStop(Math.max(0,sh2-0.1),'#d4a72c');g.addColorStop(sh2,'#ffffff');g.addColorStop(Math.min(1,sh2+0.1),'#ff4a1a');g.addColorStop(1,'#5a0a0a');break;
  default:return'#1b1c1e';}return g;}

function shopPool(){const a=[];CH.forEach(c=>SKINS.forEach(s=>{if(s.p>0&&!s.u)a.push({id:`skin:${c.id}:${s.id}`,p:s.p,r:s.r});}));SKINS.forEach(s=>{if(s.u)a.push({id:'skin:*:'+s.id,p:s.p,r:s.r});});Object.keys(SHOPW).forEach(k=>a.push({id:'wpn:'+k,p:SHOPW[k].p,r:SHOPW[k].r}));CAMOS.forEach(s=>{if(s.p>0)a.push({id:'camo:'+s.id,p:s.p,r:s.r});});TRACERS.forEach(s=>{if(s.p>0)a.push({id:'tr:'+s.id,p:s.p,r:s.r});});KFX.forEach(s=>{if(s.p>0)a.push({id:'kfx:'+s.id,p:s.p,r:s.r});});return a;}
let shopCache={day:'',items:[]};
function shopToday(){const day=dayKey();if(shopCache.day===day&&!NET.cfgDirty)return shopCache.items;NET.cfgDirty=false;const pool=shopPool();const r=srng(hashStr('shop'+day));const items=[];
 if(NET.cfg.featured&&NET.cfg.featured.length){NET.cfg.featured.forEach(f=>{const it=pool.find(q=>q.id===(f.id||f));if(it)items.push(Object.assign({},it,{p:f.p||it.p,off:f.p?Math.round((1-f.p/it.p)*100):0}));});}
 const leg=pool.filter(q=>q.r==='l'||q.r==='e'||q.r==='m');while(items.length<2){const it=leg[Math.floor(r()*leg.length)];if(!items.find(q=>q.id===it.id))items.push(Object.assign({},it));}
 while(items.length<8){const it=pool[Math.floor(r()*pool.length)];if(!items.find(q=>q.id===it.id))items.push(Object.assign({},it));}
 const d1=Math.floor(r()*items.length),d2=Math.floor(r()*items.length);[d1,d2].forEach(i=>{if(!items[i].off){items[i].off=pick([20,30,40]);items[i].p=Math.round(items[i].p*(1-items[i].off/100)/10)*10;}});
 shopCache={day,items};return items;}
